[package]
name = "kodegend"
version = "0.10.8"
edition = "2024"
description = "KODEGEN.ᴀɪ: Memory-efficient, Blazing-Fast, MCP tools for code generation agents."
authors = ["KODEGEN.ᴀɪ"]
homepage = "https://kodegen.ai"
repository = "https://github.com/cyrup-ai/kodegend"
readme = "README.md"
categories = ["development-tools", "command-line-utilities", "api-bindings"]
keywords = ["mcp", "terminal", "agent", "daemon", "claude"]
license = "Apache-2.0 OR MIT"

[package.metadata.bundle]
identifier = "ai.kodegen.kodegend"
publisher = "KODEGEN.ᴀɪ"
copyright = "Copyright © 2025"
short_description = "Memory-efficient, Blazing-Fast, MCP tools for code generation agents."

[package.metadata.bundle.category]
linux = "Development"
macos = "public.app-category.developer-tools"


[dependencies]

kodegen_bundler_autoconfig = { version = "0.10" }
kodegen_config = { version = "0.10" }
kodegen_config_manager = { version = "0.10" }
kodegen_server_http = { version = "0.10" }
kodegen_tools_filesystem = { version = "0.10" }
kodegen_tools_terminal = { version = "0.10" }
kodegen_tools_process = { version = "0.10" }
kodegen_tools_sequential_thinking = { version = "0.10" }
kodegen_tools_citescrape = { version = "0.10" }
kodegen_tools_config = { version = "0.10" }
kodegen_tools_prompt = { version = "0.10" }
kodegen_tools_introspection = { version = "0.10" }
kodegen_tools_git = { version = "0.10" }
kodegen_tools_github = { version = "0.10" }
kodegen_tools_database = { version = "0.10" }
kodegen_tools_browser = { version = "0.10" }
kodegen_tools_reasoner = { version = "0.10" }
kodegen_claude_agent = { version = "0.10" }
kodegen_candle_agent = { version = "0.10" }
kodegend_protocol_ipc = { version = "0.10" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
env_logger = "0.11"
parking_lot = "0.12"
log = "0.4"
multi_log = "0.1"  # Enables multiple simultaneous loggers
sysinfo = "0.37"
netstat2 = "0.11"  # Cross-platform network socket introspection
log-panics = { version = "2.1", features = ["with-backtrace"] }  # Route panics through log crate with backtrace
once_cell = "1" # one‑time global config
scopeguard = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] } # for the new CLI
which = "8" # locate system executables
wait-timeout = "0.2"  # Cross-platform Child::wait_timeout() for graceful shutdown
dirs = "6"
thiserror = "2"
cfg-if = "1"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = [
  "rust_backend",
] }
async-recursion = "1"
cc = "1"
tempfile = "3"
libc = "0.2"
hex = "0.4"
shlex = "1.3"  # POSIX shell escaping (MUST be >= 1.2.1 to avoid RUSTSEC-2024-0006)
polycvss = { version = "0.3", default-features = false }  # CVSS v2/v3/v4 parsing and scoring
hostname = "0.4"  # For structured HOSTNAME field in journal logs

# Archive extraction (for installer binary downloads)
zip = { version = "6", default-features = false, features = ["deflate"] }
tar = "0.4"
ar = "0.9"              # Pure Rust ar archive extraction (for .deb)
rpm = "0.18"            # RPM package parsing
cpio = "0.4"            # CPIO archive extraction (RPM payload)
liblzma = "0.4"         # Xz/LZMA decompression (RPM, compatible with rpm's liblzma-sys)
bzip2 = "0.6"           # Bzip2 decompression (RPM)
zstd = "0.13"           # Zstd decompression (RPM)

# Interactive installer wizard UI
inquire = "0.9"
indicatif = "0.18"

# async support (always enabled)
async-process = { version = "2" }
tokio = { version = "1", features = [
  "process",
  "macros",
  "signal",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "fs",
] }

# SSE server dependencies (always enabled)
axum = { version = "0.8" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex = { version = "1" }
semver = "1.0"
url = { version = "2" }
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "0.11", features = [
  "server",
  "transport-streamable-http-server",
] }
cyrup_termcolor = "2"
async-stream = { version = "0.3" }
futures-util = { version = "0.3" }
serde_urlencoded = { version = "0.7" }
rcgen = "0.14"
futures = "0.3"
time = { version = "0.3", features = ["macros", "serde"] }
tokio-stream = "0.1"
pem = "3"
x509-parser = "0.18"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
sha2 = "0.10"

# Zero-allocation performance optimizations
arrayvec = { version = "0.7", features = [
  "serde",
] } # Fixed-size arrays without heap allocation
memmap2 = { version = "0.9" } # Memory-mapped file I/O for zero-copy access
atomic-counter = { version = "1" } # Lock-free atomic counters
tokio-util = { version = "0.7" } # Tokio utilities for cancellation
dashmap = { version = "6" } # Lock-free concurrent hash maps
memchr = { version = "2" } # SIMD-accelerated string matching
fastrand = "2"
jwalk = "0.8"
rayon = "1"
walkdir = "2"

# GUI installer dependencies (always enabled - runtime detection)
eframe = { version = "0.33" }
egui = { version = "0.33" }
image = { version = "0.25" }
opener = { version = "0.8" }

[features]
default = ["systemd-notify"]
systemd-notify = ["systemd"]
systemd = ["dep:systemd"]

# platform-specific deps
[target.'cfg(target_os = "linux")'.dependencies]
users = "0.11"
systemd = { version = "0.10", optional = true }
systemd-journal-logger = "2.2"  # Direct journal API via sd_journal_send

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = [
  "fs",
  "process",
  "resource",
  "signal",
  "user",
] }

[target.'cfg(target_os = "windows")'.dependencies]
runas = "1.2"  # Self-elevation via ShellExecuteEx
windows-service = "0.8"
widestring = "1"
eventlog = "0.3"  # Windows Event Log API wrapper
winapi = { version = "0.3", features = [
  "processthreadsapi",
  "winnt",
  "handleapi",
  "securitybaseapi",
] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
oslog = "0.2"  # macOS Unified Logging integration
core-graphics2 = { version = "0.4.1", default-features = false, features = ["display", "link"] }
security-framework = "3.5"  # Native macOS certificate trust settings
core-foundation = "0.10"    # Required by security-framework
dispatch = "0.2"            # GCD main queue for Authorization Services (must run on main thread)
zip = { version = "6", default-features = false, features = [
  "aes-crypto",
  "bzip2",
  "deflate64",
  "deflate",
  "time",
  "zstd",
] }
apple-dmg = "0.5"       # Pure Rust DMG reading
fatfs = "0.3"           # FAT32 filesystem parsing

[build-dependencies]
pkg-config = "0.3"
cc = "1"
tempfile = "3"
which = "8"
zip = { version = "6", default-features = false, features = [
  "aes-crypto",
  "bzip2",
  "deflate64",
  "deflate",
  "time",
  "zstd",
] }
plist = "1"
# Dependencies needed for build scripts
jwalk = "0.8"
rayon = "1"
fastrand = "2"
sha2 = "0.10"
hex = "0.4"

# Code signing with proven library
kodegen_bundler_sign = { version = "0.10" }
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "kodegend"
path = "src/main.rs"
